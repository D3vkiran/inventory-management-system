server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: inventory-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/inventory_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-must-be-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  seed:
    owner-email: ${OWNER_EMAIL:owner@inventory.local}
    owner-password: ${OWNER_PASSWORD:ChangeMe123!}
    owner-name: ${OWNER_NAME:Owner}

amazon:
  sp-api:
    endpoint: ${AMAZON_SP_API_ENDPOINT:https://sellingpartnerapi-na.amazon.com}
    region: ${AMAZON_SP_API_REGION:us-east-1}
    marketplace-id: ${AMAZON_MARKETPLACE_ID:}
    seller-id: ${AMAZON_SELLER_ID:}
    lwa-client-id: ${AMAZON_LWA_CLIENT_ID:}
    lwa-client-secret: ${AMAZON_LWA_CLIENT_SECRET:}
    lwa-refresh-token: ${AMAZON_LWA_REFRESH_TOKEN:}
    aws-access-key-id: ${AMAZON_AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY_ID:}}
    aws-secret-access-key: ${AMAZON_AWS_SECRET_ACCESS_KEY:${AWS_SECRET_ACCESS_KEY:}}
    aws-session-token: ${AMAZON_AWS_SESSION_TOKEN:${AWS_SESSION_TOKEN:}}
